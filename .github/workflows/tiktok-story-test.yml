name: TikTok Story Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Test TikTok profile
        run: |
          python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright

          USERNAME = "raspbeyih_"
          URL = f"https://www.tiktok.com/@{USERNAME}"

          async def main():
              async with async_playwright() as p:

                  browser = await p.chromium.launch(
                      headless=True
                  )

                  page = await browser.new_page(
                      user_agent=(
                          "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) "
                          "AppleWebKit/605.1.15 (KHTML, like Gecko) "
                          "Version/17.0 Mobile/15E148 Safari/604.1"
                      )
                  )

                  print("================================")
                  print("TIKTOK STORY DETECTION TEST")
                  print("================================")
                  print("Username:", USERNAME)
                  print("URL:", URL)
                  print()

                  try:
                      response = await page.goto(
                          URL,
                          wait_until="domcontentloaded",
                          timeout=60000
                      )

                      print(
                          "HTTP Status:",
                          response.status if response else "NONE"
                      )

                      await page.wait_for_timeout(5000)

                      print("Final URL:", page.url)
                      print("Page title:", await page.title())

                      html = await page.content()
                      lower = html.lower()

                      print("HTML length:", len(html))
                      print()

                      # ==========================================
                      # CEK BERBAGAI INDIKATOR STORY
                      # ==========================================

                      print("================================")
                      print("STORY INDICATORS")
                      print("================================")

                      indicators = [
                          "story",
                          "story_id",
                          "storyid",
                          "story_type",
                          "storyitem",
                          "story-item",
                          "story_item",
                          "stories",
                          "aweme_id",
                          "awemeid",
                      ]

                      for item in indicators:
                          count = lower.count(item)
                          print(f"{item:20} => {count}")

                      # ==========================================
                      # CARI ELEMEN YANG MENGANDUNG STORY
                      # ==========================================

                      print()
                      print("================================")
                      print("DOM ELEMENTS WITH STORY")
                      print("================================")

                      elements = await page.locator(
                          "text=/story/i"
                      ).all()

                      print("Jumlah text element:", len(elements))

                      for i, element in enumerate(elements[:20]):
                          try:
                              text = await element.inner_text()
                              print(f"[{i}] {text[:200]}")
                          except:
                              pass

                      # ==========================================
                      # CARI LINK YANG MENGANDUNG STORY
                      # ==========================================

                      print()
                      print("================================")
                      print("LINKS WITH STORY")
                      print("================================")

                      links = await page.locator("a").all()

                      story_links = []

                      for link in links:
                          try:
                              href = await link.get_attribute("href")
                              text = await link.inner_text()

                              combined = (
                                  (href or "") + " " + (text or "")
                              ).lower()

                              if "story" in combined:
                                  story_links.append(
                                      (href, text)
                                  )
                          except:
                              pass

                      print(
                          "Jumlah link terkait story:",
                          len(story_links)
                      )

                      for href, text in story_links[:20]:
                          print("TEXT:", text[:100])
                          print("HREF:", href)
                          print("---")

                      # ==========================================
                      # HASIL AKHIR
                      # ==========================================

                      print()
                      print("================================")
                      print("HASIL")
                      print("================================")

                      print(
                          "Halaman TikTok berhasil dibuka:",
                          response.status == 200 if response else False
                      )

                      print(
                          "Kata 'story' ditemukan:",
                          "story" in lower
                      )

                      print(
                          "Jumlah elemen text Story:",
                          len(elements)
                      )

                      print(
                          "Jumlah link Story:",
                          len(story_links)
                      )

                  except Exception as e:
                      print("ERROR:", repr(e))
                      raise

                  finally:
                      await browser.close()

          asyncio.run(main())
          PY
