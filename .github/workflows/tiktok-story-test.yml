name: TikTok Network Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Monitor TikTok network
        run: |
          python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright

          USERNAME = "raspbeyih_"
          URL = f"https://www.tiktok.com/@{USERNAME}"

          async def main():

              async with async_playwright() as p:

                  browser = await p.chromium.launch(
                      headless=True
                  )

                  page = await browser.new_page(
                      user_agent=(
                          "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) "
                          "AppleWebKit/605.1.15 (KHTML, like Gecko) "
                          "Version/17.0 Mobile/15E148 Safari/604.1"
                      )
                  )

                  print("================================")
                  print("TIKTOK NETWORK TEST")
                  print("================================")
                  print("Username:", USERNAME)
                  print("URL:", URL)
                  print()

                  requests_found = []

                  async def handle_response(response):

                      try:
                          request = response.request

                          if request.resource_type not in [
                              "xhr",
                              "fetch"
                          ]:
                              return

                          url = response.url.lower()

                          interesting = any(
                              keyword in url
                              for keyword in [
                                  "story",
                                  "aweme",
                                  "feed",
                                  "item",
                                  "user"
                              ]
                          )

                          if not interesting:
                              return

                          print()
                          print("========== REQUEST ==========")
                          print("Status:", response.status)
                          print("Type:", request.resource_type)
                          print("URL:", response.url[:1000])

                          requests_found.append(response.url)

                          # Coba baca response JSON
                          try:
                              data = await response.json()

                              text = str(data)

                              print(
                                  "Response length:",
                                  len(text)
                              )

                              lower = text.lower()

                              for keyword in [
                                  "story",
                                  "aweme_id",
                                  "awemeid",
                                  "story_id",
                                  "storyid"
                              ]:

                                  if keyword in lower:
                                      print(
                                          "FOUND:",
                                          keyword
                                      )

                          except Exception:
                              pass

                      except Exception:
                          pass

                  page.on(
                      "response",
                      lambda response:
                      asyncio.create_task(
                          handle_response(response)
                      )
                  )

                  try:

                      response = await page.goto(
                          URL,
                          wait_until="domcontentloaded",
                          timeout=60000
                      )

                      print(
                          "Profile HTTP Status:",
                          response.status
                          if response else "NONE"
                      )

                      # Beri TikTok waktu untuk menjalankan
                      # JavaScript dan memanggil API.
                      await page.wait_for_timeout(15000)

                      print()
                      print("================================")
                      print("NETWORK TEST SELESAI")
                      print("================================")

                      print(
                          "Interesting requests:",
                          len(requests_found)
                      )

                  except Exception as e:

                      print(
                          "ERROR:",
                          repr(e)
                      )

                  finally:

                      await browser.close()

          asyncio.run(main())
          PY
