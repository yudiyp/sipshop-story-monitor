name: TikTok Network Full Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Capture TikTok API
        run: |
          python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright

          USERNAME = "raspbeyih_"
          URL = f"https://www.tiktok.com/@{USERNAME}"

          async def main():

              async with async_playwright() as p:

                  browser = await p.chromium.launch(
                      headless=True
                  )

                  page = await browser.new_page(
                      user_agent=(
                          "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) "
                          "AppleWebKit/605.1.15 (KHTML, like Gecko) "
                          "Version/17.0 Mobile/15E148 Safari/604.1"
                      )
                  )

                  seen = set()

                  async def handle_response(response):

                      try:

                          request = response.request

                          if request.resource_type not in [
                              "xhr",
                              "fetch"
                          ]:
                              return

                          url = response.url

                          # Jangan cetak URL berulang
                          clean_url = url.split("?")[0]

                          if clean_url in seen:
                              return

                          seen.add(clean_url)

                          print()
                          print("========== API ==========")
                          print("STATUS:", response.status)
                          print("TYPE:", request.resource_type)
                          print("URL:", clean_url[:500])

                          # Coba baca JSON
                          try:

                              data = await response.json()

                              text = str(data)

                              print(
                                  "JSON LENGTH:",
                                  len(text)
                              )

                              # Cari indikator umum
                              lower = text.lower()

                              keywords = [
                                  "story",
                                  "story_id",
                                  "storyid",
                                  "story_type",
                                  "aweme_id",
                                  "item_id",
                                  "post",
                                  "repost",
                                  "video"
                              ]

                              found = []

                              for keyword in keywords:

                                  if keyword in lower:
                                      found.append(keyword)

                              if found:
                                  print(
                                      "KEYWORDS:",
                                      ", ".join(found)
                                  )

                          except Exception:
                              print(
                                  "RESPONSE: non-JSON"
                              )

                      except Exception:
                          pass

                  page.on(
                      "response",
                      lambda response:
                      asyncio.create_task(
                          handle_response(response)
                      )
                  )

                  print("================================")
                  print("TIKTOK FULL NETWORK TEST")
                  print("================================")
                  print("Profile:", URL)
                  print()

                  try:

                      await page.goto(
                          URL,
                          wait_until="domcontentloaded",
                          timeout=60000
                      )

                      await page.wait_for_timeout(
                          20000
                      )

                  finally:

                      await browser.close()

                  print()
                  print("================================")
                  print("TOTAL UNIQUE API:")
                  print(len(seen))
                  print("================================")

          asyncio.run(main())
          PY
