name: TikTok Story Data Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Inspect TikTok data
        run: |
          python - <<'PY'
          import asyncio
          import json
          from playwright.async_api import async_playwright

          USERNAME = "raspbeyih_"
          URL = f"https://www.tiktok.com/@{USERNAME}"

          async def main():

              async with async_playwright() as p:

                  browser = await p.chromium.launch(
                      headless=True
                  )

                  page = await browser.new_page(
                      user_agent=(
                          "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) "
                          "AppleWebKit/605.1.15 (KHTML, like Gecko) "
                          "Version/17.0 Mobile/15E148 Safari/604.1"
                      )
                  )

                  print("================================")
                  print("TIKTOK DATA INSPECTION")
                  print("================================")
                  print("Username:", USERNAME)
                  print()

                  async def handle_response(response):

                      try:

                          if "preload/item_list" not in response.url:
                              return

                          if response.status != 200:
                              return

                          print()
                          print("================================")
                          print("ITEM LIST RESPONSE FOUND")
                          print("================================")
                          print("Status:", response.status)

                          data = await response.json()

                          print()
                          print("TOP LEVEL KEYS:")
                          print(
                              list(data.keys())
                              if isinstance(data, dict)
                              else type(data)
                          )

                          # Simpan struktur JSON
                          with open(
                              "/tmp/tiktok_response.json",
                              "w",
                              encoding="utf-8"
                          ) as f:
                              json.dump(
                                  data,
                                  f,
                                  ensure_ascii=False,
                                  indent=2
                              )

                          print()
                          print(
                              "JSON berhasil disimpan."
                          )

                          # Cari struktur item
                          items = []

                          def find_items(obj):

                              if isinstance(obj, dict):

                                  for key, value in obj.items():

                                      if key in [
                                          "itemList",
                                          "item_list",
                                          "items"
                                      ] and isinstance(
                                          value, list
                                      ):
                                          items.extend(value)

                                      find_items(value)

                              elif isinstance(obj, list):

                                  for value in obj:
                                      find_items(value)

                          find_items(data)

                          print()
                          print(
                              "Jumlah item ditemukan:",
                              len(items)
                          )

                          for i, item in enumerate(
                              items[:10]
                          ):

                              if not isinstance(
                                  item,
                                  dict
                              ):
                                  continue

                              print()
                              print(
                                  "---------- ITEM",
                                  i + 1,
                                  "----------"
                              )

                              # Hanya field yang relevan
                              interesting = [
                                  "id",
                                  "item_id",
                                  "aweme_id",
                                  "desc",
                                  "createTime",
                                  "create_time",
                                  "author",
                                  "authorInfo",
                                  "video",
                                  "imagePost",
                                  "stats"
                              ]

                              for key in interesting:

                                  if key not in item:
                                      continue

                                  value = item[key]

                                  if isinstance(
                                      value,
                                      dict
                                  ):
                                      print(
                                          key,
                                          ":",
                                          list(
                                              value.keys()
                                          )[:30]
                                      )
                                  else:
                                      text = str(value)
                                      print(
                                          key,
                                          ":",
                                          text[:300]
                                      )

                          # Cari kata-kata Story di JSON
                          text = json.dumps(
                              data,
                              ensure_ascii=False
                          ).lower()

                          print()
                          print("================================")
                          print("STORY KEYWORD CHECK")
                          print("================================")

                          keywords = [
                              "story",
                              "story_id",
                              "storyid",
                              "story_type",
                              "storyitem",
                              "story_item",
                              "storyitemid"
                          ]

                          for keyword in keywords:

                              print(
                                  keyword,
                                  "=>",
                                  text.count(keyword)
                              )

                      except Exception as e:

                          print(
                              "ERROR INSIDE RESPONSE:",
                              repr(e)
                          )

                  page.on(
                      "response",
                      lambda response:
                      asyncio.create_task(
                          handle_response(response)
                      )
                  )

                  try:

                      await page.goto(
                          URL,
                          wait_until="domcontentloaded",
                          timeout=60000
                      )

                      await page.wait_for_timeout(
                          15000
                      )

                      print()
                      print("================================")
                      print("TEST SELESAI")
                      print("================================")

                  finally:

                      await browser.close()

          asyncio.run(main())
          PY
