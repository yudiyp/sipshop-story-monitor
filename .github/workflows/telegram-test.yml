name: Telegram Test

on:
  workflow_dispatch:

jobs:
  telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Check Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          base = f"https://api.telegram.org/bot{token}"

          # Cek webhook
          response = requests.get(
              f"{base}/getWebhookInfo",
              timeout=30
          )

          data = response.json()

          print("=== WEBHOOK INFO ===")
          print(data)

          webhook = data.get("result", {})
          webhook_url = webhook.get("url", "")

          print()
          print("Webhook URL:", webhook_url)

          if webhook_url:
              print()
              print("WEBHOOK AKTIF - menghapus webhook...")
              
              delete_response = requests.post(
                  f"{base}/deleteWebhook",
                  json={"drop_pending_updates": False},
                  timeout=30
              )

              print("Delete webhook:", delete_response.json())

          # Ambil update
          response = requests.get(
              f"{base}/getUpdates",
              params={
                  "limit": 100,
                  "allowed_updates": '["message"]'
              },
              timeout=30
          )

          data = response.json()

          print()
          print("=== GET UPDATES ===")
          print("Telegram API OK:", data.get("ok"))

          updates = data.get("result", [])

          print("Jumlah update:", len(updates))

          for update in updates:
              message = update.get("message", {})
              chat = message.get("chat", {})

              print("--------------------------------")
              print("Chat ID:", chat.get("id"))
              print("Chat type:", chat.get("type"))
              print("Nama:", chat.get("first_name"))
              print("Username:", chat.get("username"))
              print("Message:", message.get("text"))
          PY
