name: Telegram Test

on:
  workflow_dispatch:

jobs:
  telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Listen for Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests
          import time

          token = os.environ["TELEGRAM_BOT_TOKEN"]

          url = f"https://api.telegram.org/bot{token}/getUpdates"

          print("================================")
          print("TELEGRAM LISTENER TEST")
          print("================================")
          print()
          print("Menunggu pesan Telegram selama 30 detik...")
          print("Sekarang kirim TEST ke bot kamu.")
          print()

          response = requests.get(
              url,
              params={
                  "timeout": 25,
                  "limit": 10
              },
              timeout=35
          )

          data = response.json()

          print("API OK:", data.get("ok"))
          print()

          if not data.get("ok"):
              print("ERROR:")
              print(data)
              raise SystemExit(1)

          updates = data.get("result", [])

          print("Jumlah update:", len(updates))
          print()

          for update in updates:

              print("========== UPDATE ==========")
              print("Update ID:", update.get("update_id"))

              message = update.get("message")

              if message:
                  chat = message.get("chat", {})

                  print("Chat ID:", chat.get("id"))
                  print("Chat Type:", chat.get("type"))
                  print("First Name:", chat.get("first_name"))
                  print("Username:", chat.get("username"))
                  print("Message:", message.get("text"))

          print()
          print("================================")
          print("TEST SELESAI")
          print("================================")
          PY
