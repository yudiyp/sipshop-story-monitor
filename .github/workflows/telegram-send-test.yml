name: Telegram Send Test

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          RESPONSE=$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=7725653499" \
            --data-urlencode "text=🚨 TEST NOTIFICATION

SipShop Story Monitor berhasil terhubung!

GitHub → Telegram → iPhone ✅

Ini hanya pesan percobaan.")

          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "Pesan berhasil dikirim!"
          else
            echo "Gagal mengirim pesan."
            exit 1
          fi
